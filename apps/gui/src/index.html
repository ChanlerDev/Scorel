<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scorel</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f1f2f3;
        --surface-soft: #f7f7f8;
        --hover: #e8eaec;
        --border: #e3e5e7;
        --border-strong: #d2d5d8;
        --text: #171717;
        --muted: #6f7377;
        --faint: #a7abb0;
        --accent: #111111;
        --warn: #f06423;
        --ok: #6fd082;
        --danger: #d93f32;
        --radius: 12px;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      * {
        box-sizing: border-box;
      }

      body {
        position: relative;
        margin: 0;
        overflow: hidden;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }

      button:disabled,
      input:disabled,
      textarea:disabled {
        cursor: not-allowed;
        opacity: 0.42;
        pointer-events: none;
      }

      #root {
        isolation: isolate;
      }

      #root,
      .app-shell {
        display: grid;
        width: 100vw;
        height: 100vh;
        grid-template-columns: 276px minmax(0, 1fr);
        background: var(--bg);
      }

      .sidebar {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        min-height: 0;
        border-right: 1px solid var(--border);
        background: var(--surface);
        padding: 18px 14px 16px;
      }

      .traffic-space {
        height: 34px;
      }

      .side-actions,
      .side-scroll,
      .bottom-zone {
        min-width: 0;
      }

      .side-action,
      .project-row,
      .session-row,
      .settings-button {
        display: grid;
        width: 100%;
        min-height: 34px;
        grid-template-columns: 24px minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        border-radius: 8px;
        padding: 5px 8px;
        color: var(--text);
        font-size: 14px;
        text-align: left;
      }

      .side-action:hover,
      .project-row:hover,
      .project-row.active,
      .session-row:hover,
      .session-row.active,
      .settings-button:hover {
        background: var(--hover);
      }

      .icon {
        width: 20px;
        color: #5f6368;
        text-align: center;
      }

      .label,
      .project-row span,
      .session-row span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .side-scroll {
        overflow: auto;
        padding-top: 26px;
      }

      .section-title {
        margin: 0 0 10px 8px;
        color: var(--faint);
        font-size: 13px;
        font-weight: 600;
      }

      .section-header {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        margin-top: 20px;
      }

      .mini-button {
        min-width: 28px;
        min-height: 28px;
        border-radius: 8px;
        color: var(--muted);
        font-size: 18px;
      }

      .mini-button:hover {
        background: var(--hover);
      }

      .project-list,
      .session-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .muted-row {
        padding: 3px 8px 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .source-pill {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--ok);
      }

      .source-pill.local {
        background: var(--faint);
      }

      .source-pill.offline {
        background: var(--faint);
      }

      .session-row {
        grid-template-columns: 24px minmax(0, 1fr);
        color: var(--muted);
      }

      .bottom-zone {
        position: relative;
        padding-top: 12px;
      }

      .settings-button {
        grid-template-columns: 24px minmax(0, 1fr) 20px;
        font-weight: 500;
      }

      .settings-popover {
        display: grid;
        width: 286px;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--bg);
        padding: 12px;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.14);
        z-index: 20;
      }

      .popover-title {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }

      .settings-popover input {
        width: 100%;
        min-height: 34px;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 6px 9px;
        outline: none;
      }

      .settings-popover input:focus {
        border-color: var(--border-strong);
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .soft-button {
        min-height: 34px;
        border-radius: 9px;
        background: var(--surface-soft);
      }

      .soft-button:hover {
        background: var(--hover);
      }

      .pair-code {
        display: grid;
        gap: 2px;
        border-radius: 10px;
        background: var(--surface-soft);
        padding: 9px;
      }

      .pair-code strong {
        font-size: 20px;
      }

      .hint,
      .pair-code small {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .device-list,
      .directory-list {
        display: grid;
        gap: 4px;
      }

      .device-row,
      .directory-list button {
        display: grid;
        min-height: 30px;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        border-radius: 8px;
        padding: 5px 7px;
        color: var(--muted);
        font-size: 12px;
        text-align: left;
      }

      .device-row:hover,
      .device-row.active,
      .directory-list button:hover {
        background: var(--surface-soft);
        color: var(--text);
      }

      .main {
        display: grid;
        min-width: 0;
        min-height: 0;
        grid-template-rows: 64px minmax(0, 1fr);
        background: var(--bg);
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        border-bottom: 1px solid rgba(227, 229, 231, 0.65);
        padding: 0 18px 0 24px;
      }

      .title-wrap {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 10px;
      }

      .title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 15px;
        font-weight: 650;
      }

      .ellipsis {
        color: var(--muted);
      }

      .top-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .toolbar-button {
        min-width: 36px;
        min-height: 32px;
        border: 1px solid var(--border);
        border-radius: 11px;
        color: var(--muted);
      }

      .toolbar-button:hover {
        background: var(--surface-soft);
      }

      .content {
        display: grid;
        min-height: 0;
        grid-template-rows: minmax(0, 1fr);
        padding: 24px;
      }

      .empty-content {
        align-content: center;
        justify-items: center;
        padding-bottom: 9vh;
      }

      .empty-stack {
        display: grid;
        width: min(980px, 100%);
        gap: 28px;
        justify-items: center;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 520;
        letter-spacing: 0;
      }

      .transcript-wrap {
        display: grid;
        min-height: 0;
        grid-template-rows: minmax(0, 1fr) auto;
      }

      .transcript {
        overflow: auto;
        min-height: 0;
        padding: 18px 0 28px;
      }

      .message {
        max-width: 820px;
        margin: 0 auto 24px;
        font-size: 15px;
        line-height: 1.62;
      }

      .message.user {
        max-width: 68%;
        margin-right: calc((100% - min(820px, 100%)) / 2);
        border-radius: 16px;
        background: var(--surface-soft);
        padding: 12px 14px;
      }

      .role {
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .message p,
      .empty {
        margin: 0;
        white-space: pre-wrap;
      }

      .composer-shell {
        width: min(920px, 100%);
      }

      .transcript-wrap .composer-shell {
        margin: 0 auto;
      }

      .composer {
        display: grid;
        min-height: 92px;
        grid-template-rows: minmax(42px, auto) auto;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--bg);
        padding: 13px 14px 10px;
      }

      .composer:focus-within {
        border-color: var(--border-strong);
      }

      .composer textarea {
        min-height: 38px;
        max-height: 180px;
        resize: vertical;
        border: 0;
        color: var(--text);
        font-size: 15px;
        line-height: 1.5;
        outline: 0;
      }

      .composer textarea::placeholder {
        color: var(--faint);
      }

      .composer-bar {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
      }

      .composer-left,
      .composer-right,
      .meta-row {
        display: flex;
        min-width: 0;
        gap: 10px;
        align-items: center;
      }

      .round-button {
        display: inline-grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 999px;
        color: var(--muted);
        font-size: 22px;
      }

      .round-button:hover {
        background: var(--surface-soft);
      }

      .access-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 30px;
        border-radius: 999px;
        color: var(--warn);
        font-size: 13px;
        font-weight: 600;
      }

      .model-pill {
        color: var(--text);
        font-size: 14px;
      }

      .send-button {
        display: inline-grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 999px;
        background: #8b8c90;
        color: var(--bg);
        font-size: 21px;
      }

      .send-button:not(:disabled) {
        background: var(--accent);
      }

      .meta-row {
        min-height: 42px;
        border-radius: 0 0 22px 22px;
        background: rgba(247, 247, 248, 0.92);
        padding: 0 14px;
        color: var(--muted);
        font-size: 13px;
      }

      .meta-item {
        display: inline-flex;
        min-width: 0;
        align-items: center;
        gap: 6px;
      }

      .meta-item span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .error-line {
        color: var(--danger);
        font-size: 12px;
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script src="./renderer.js"></script>
  </body>
</html>
